name: emulator

on:
  push:
    paths: &paths ["tools/emu/**", "lapin/**", "artifacts/*.sim", "scripts/ci-local.sh", "scripts/lapin-suites.sh", ".github/**"]
  pull_request:
    paths: *paths

# Four jobs at once, each with its build cache; scripts/ci-local.sh runs
# the same steps, one after the other.
jobs:
  lapin:
    name: lapin's crates and image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lapin
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            lapin
            lapin/fuzz
      - run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi
      - run: cargo fmt --all --check
      - run: cargo clippy --profile host -p lapin-p256 -p lapin-core -p lapin-metal -p lapin-metal-cref -p lapin-pack --all-targets -- -D warnings
      - name: The firmware's lints
        working-directory: lapin/fw
        run: cargo clippy --release -- -D warnings
      - run: cargo test --profile host -p lapin-p256 -p lapin-core -p lapin-metal -p lapin-metal-cref -p lapin-pack
      - name: The fuzzing harness's own lints and tests
        working-directory: lapin/fuzz
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release
      - run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: lapin-images
          # The first image too: tests/first_flash.rs and tests/rescue.rs
          # send it.
          path: |
            lapin/target/*-full.bin
            lapin/target/lapin-first.bin

  lints:
    name: emulator lints
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/emu
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/emu
      - run: rustup target add wasm32-unknown-unknown
      - name: No duplication but what nose.ignore.json says must stay
        working-directory: .
        env:
          NOSE: v0.22.1
        run: |
          base="https://github.com/corca-ai/nose/releases/download/$NOSE"
          file=nose-cli-x86_64-unknown-linux-gnu.tar.xz
          curl -sSLf --proto '=https' -o "$file" "$base/$file"
          curl -sSLf --proto '=https' -o "$file.sha256" "$base/$file.sha256"
          sha256sum -c "$file.sha256"
          tar -xJf "$file"
          export PATH="$PWD/${file%.tar.xz}:$PATH"
          scripts/nose.sh
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo clippy --release --lib --target wasm32-unknown-unknown -- -D warnings

  r3:
    name: every test, on r3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/emu
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/emu
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Fetch the ARM7TDMI instruction test ROMs
        run: |
          mkdir -p tests/roms
          curl -sSL --fail -o tests/roms/arm.gba https://github.com/jsmolka/gba-tests/raw/master/arm/arm.gba
          curl -sSL --fail -o tests/roms/thumb.gba https://github.com/jsmolka/gba-tests/raw/master/thumb/thumb.gba
          sha256sum -c <<'SUMS'
          77ee88662552bdc885c1080c0172ff119d54db791bd73b21808cf1ff1fe5b40e  tests/roms/arm.gba
          b5cb2291df4ab314b31c598acd9bff2ccfa0b38efff29daadfe97422ce369b67  tests/roms/thumb.gba
          SUMS
      - name: Every test that follows the firmware under test, on r3
        run: |
          filter=$(../../scripts/lapin-suites.sh r3)
          cargo nextest run --release --no-fail-fast -E "$filter"
      - run: cargo test --release --doc

  on-lapin:
    name: the acceptance tests, on lapin
    needs: lapin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/emu
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/emu
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: actions/download-artifact@v8
        with:
          name: lapin-images
          path: lapin/target
      - name: The same acceptance tests, on the Rust firmware
        env:
          NABEMU_FIRMWARE: lapin
        run: |
          args=$(../../scripts/lapin-suites.sh lapin)
          read -ra suites <<<"$args"
          cargo nextest run --release --no-fail-fast "${suites[@]}"

  browser:
    name: the browser build
    needs: lapin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/emu
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/emu
      - uses: actions/download-artifact@v8
        with:
          name: lapin-images
          path: lapin/target
      - uses: oven-sh/setup-bun@v2
      - name: Build for the browser and test that build under bun
        run: |
          rustup target add wasm32-unknown-unknown
          web/build.sh
          bun run --cwd web test
