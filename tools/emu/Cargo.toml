[package]
name = "nabemu"
version = "0.1.0"
edition = "2024"
description = "Emulator for the Nabaztag:tag main board (ML67Q4051, ARM7TDMI)"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
aes = "0.9.4"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-icmp", "socket-dhcpv4", "proto-dhcpv4"] }

[profile.dev]
opt-level = 2

[profile.release]
debug = true

# What ships to the browser: small, no debug information.
[profile.web]
inherits = "release"
debug = false
strip = true
lto = true
codegen-units = 1

[target.'cfg(target_os = "linux")'.dev-dependencies]
# tests/hostapd.rs talks to the kernel's simulated radios.
libc = "0.2"
