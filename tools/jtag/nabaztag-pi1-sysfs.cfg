# Second fallback for nabaztag-pi1.cfg: OpenOCD `sysfsgpio` driver
# (/sys/class/gpio), for kernels where bcm2835gpio's direct /dev/mem access
# reads back nothing (seen on Alpine armhf, kernel 6.6+) and linuxgpiod is
# not compiled into the openocd package.
#
# Slower than bcm2835gpio (every TCK edge is a sysfs write syscall) but uses
# the exact kernel interface a manual bit-bang IDCODE test validates.
#
# GPIO numbers are GLOBAL sysfs numbers: this kernel's gpiochip base is 512,
# so BCM GPIO n = 512 + n. Wiring is unchanged (see nabaztag-pi1.cfg).
#
#   Signal   BCM GPIO   sysfs number
#   TDI       10          522
#   TDO        9          521
#   TMS       25          537
#   TCK       11          523
#   RESETN     8          520
#
# If /sys/class/gpio/gpiochip512 has a different base on your kernel
# (ls /sys/class/gpio), adjust: sysfs number = base + BCM number.

adapter driver sysfsgpio

# sysfsgpio was not migrated to the `adapter gpio` framework in 0.12 — it
# still uses its own legacy commands (order: tck tms tdi tdo).
sysfsgpio jtag_nums 523 537 522 521
sysfsgpio srst_num 520

adapter speed 100

transport select jtag

jtag newtap ml67q4051 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x3f0f0f0f

target create ml67q4051.cpu arm7tdmi -endian little -chain-position ml67q4051.cpu
ml67q4051.cpu configure -work-area-phys 0x10000000 -work-area-size 0x2000

reset_config srst_only srst_push_pull
adapter srst delay 200
