# Nabaztag V2 (OKI ML67Q4051) JTAG via Raspberry Pi 1 / Zero / Zero W GPIO,
# for STOCK OpenOCD >= 0.12 (plain `apt install openocd` on Raspberry Pi OS).
#
# No custom flash driver needed: flashing is done by the RAM stub
# (stub.bin + flash-jtag.tcl), not by an OpenOCD `flash bank`.
#
# Wiring (6 wires, all on consecutive physical pins 19-25; J29 pin 1 = square
# pad = 3.3V and is LEFT UNCONNECTED; J29 pin 3 nTRST also unconnected — it
# has an on-board pull-up):
#
#   Signal   J29 pin   Pi BCM GPIO   Pi physical pin
#   TDI        4         GPIO10          19
#   TDO        7         GPIO9           21
#   TMS        5         GPIO25          22
#   TCK        6         GPIO11          23
#   RESETN     8         GPIO8           24
#   GND        2         --              25
#
# Run on the Pi, from this directory:
#   sudo openocd -f nabaztag-pi1.cfg
# or to flash directly, see flash-jtag.tcl.

adapter driver bcm2835gpio

# BCM2835 peripheral base — Pi 1 / Zero / Zero W only.
# (Pi 2/3: 0x3F000000, Pi 4: 0xFE000000, Pi 5: bcm2835gpio does not work.)
bcm2835gpio peripheral_base 0x20000000
bcm2835gpio speed_coeffs 113714 28

# Start slow; once the IDCODE scan is reliable you can raise this to 1000.
adapter speed 100

adapter gpio tdi 10
adapter gpio tdo 9
adapter gpio tms 25
adapter gpio tck 11
adapter gpio srst 8

transport select jtag

jtag newtap ml67q4051 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x3f0f0f0f

target create ml67q4051.cpu arm7tdmi -endian little -chain-position ml67q4051.cpu
ml67q4051.cpu configure -work-area-phys 0x10000000 -work-area-size 0x2000

# Only RESETN is wired (no TRST line to the adapter).
reset_config srst_only srst_push_pull
adapter srst delay 200
