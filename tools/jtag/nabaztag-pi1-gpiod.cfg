# Fallback for nabaztag-pi1.cfg using the kernel GPIO character device
# (/dev/gpiochip0) instead of direct /dev/mem register access.
#
# Use this if bcm2835gpio fails with a /dev/mem error (e.g. kernel built with
# CONFIG_STRICT_DEVMEM / no /dev/mem, which can happen on Alpine). Slower than
# bcm2835gpio but works on any kernel with gpiolib — same wiring, same usage:
#   sudo openocd -f nabaztag-pi1-gpiod.cfg -f flash-jtag.tcl -c "..."
#
# Requires OpenOCD built with linuxgpiod (the Alpine `openocd` package is).

adapter driver linuxgpiod

adapter gpio tdi 10 -chip 0
adapter gpio tdo 9 -chip 0
adapter gpio tms 25 -chip 0
adapter gpio tck 11 -chip 0
adapter gpio srst 8 -chip 0

adapter speed 100

transport select jtag

jtag newtap ml67q4051 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x3f0f0f0f

target create ml67q4051.cpu arm7tdmi -endian little -chain-position ml67q4051.cpu
ml67q4051.cpu configure -work-area-phys 0x10000000 -work-area-size 0x2000

reset_config srst_only srst_push_pull
adapter srst delay 200
